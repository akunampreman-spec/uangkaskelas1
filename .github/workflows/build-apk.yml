name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd extracted/UangKasKelas12Putra
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: uang-kas-kelas-12-putra-apk
          path: extracted/UangKasKelas12Putra/app/build/outputs/apk/debug/*.apk
